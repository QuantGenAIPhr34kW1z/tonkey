<div class="card">
    <div class="card-header">
        <h3>Transaction History</h3>
        <div class="header-filters">
            <select class="filter-select" onchange="filterTransactions(this.value)">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="submitted">Submitted</option>
                <option value="confirmed">Confirmed</option>
                <option value="failed">Failed</option>
            </select>
        </div>
    </div>
    <div class="card-body">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody>
                {{range .Transactions}}
                <tr>
                    <td><code class="tx-id">{{.ID}}</code></td>
                    <td><code class="address">{{.From}}</code></td>
                    <td><code class="address">{{.To}}</code></td>
                    <td class="amount">{{formatAmount .Amount}}</td>
                    <td>
                        <span class="status-badge {{.Status}}">{{.Status}}</span>
                    </td>
                    <td>{{formatTime .CreatedAt}}</td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="6" class="empty-state">No transactions found</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</div>
