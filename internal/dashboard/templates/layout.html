<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Data.Title}} - tonkey Admin</title>
    <link rel="stylesheet" href="/admin/dashboard/static/dashboard.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

    <div class="layout">

                <h1>tonkey</h1>
                <span class="version">v{{.Data.Version}}</span>
            </div>
            <ul class="nav-menu">
                <li class="{{if eq .Data.Active "dashboard"}}active{{end}}">
                    <a href="/admin/dashboard">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">

                        </svg>
                        Users
                    </a>
                </li>
                <li class="{{if eq .Data.Active "transactions"}}active{{end}}">
                    <a href="/admin/dashboard/transactions">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/>
                        </svg>
                        Transactions
                    </a>
                </li>
                <li class="{{if eq .Data.Active "webhooks"}}active{{end}}">
                    <a href="/admin/dashboard/webhooks">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                        </svg>
                        Webhooks
                    </a>
                </li>
                <li class="{{if eq .Data.Active "audit"}}active{{end}}">
                    <a href="/admin/dashboard/audit">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>

                    </a>

                <li class="{{if eq .Data.Active "jobs"}}active{{end}}">

                        Jobs
                    </a>
                </li>
                <li class="{{if eq .Data.Active "settings"}}active{{end}}">
                    <a href="/admin/dashboard/settings">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>

            </ul>
            <div class="sidebar-footer">
                <a href="/api/docs" target="_blank">API Docs</a>
                <a href="/metrics" target="_blank">Metrics</a>
            </div>
        </nav>
        <main class="content">
            <header class="content-header">
                <h2>{{.Data.Title}}</h2>
                <div class="header-actions">
                    <span class="refresh-indicator" id="refresh-indicator"></span>
                    <button onclick="location.reload()" class="btn btn-secondary">Refresh</button>
                </div>
            </header>
            <div class="content-body">
                {{template .Content .Data}}
            </div>
        </main>
    </div>
    <script src="/admin/dashboard/static/dashboard.js"></script>
</body>
</html>
